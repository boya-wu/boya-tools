<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>十秒喊停</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --soil-deep:#1b140e;
  --soil:#231a13;
  --loam:#2f2318;
  --root:#4a3826;
  --leaf:#7cc35a;
  --leaf-dark:#4a8434;
  --petal:#e0574a;
  --petal-dark:#9e3529;
  --p1:#f0b429;
  --p1-dark:#a07408;
  --p2:#4f9ee0;
  --p2-dark:#2a6ba1;
  --stone:#8a7963;
  --stone-dark:#584a3b;
  --bone:#f4ecdd;
  --moss:#a99880;
  --lift:4px;
  --col-time:78px;
  --col-diff:74px;
  /* 結算三態 */
  --over:#e0574a;
  --exact:#7cc35a;
  --under:#5ac8e8;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:'Baloo 2','Noto Sans TC',system-ui,sans-serif;
  background:
    radial-gradient(120% 80% at 50% -10%, #3a2c1e 0%, transparent 60%),
    radial-gradient(circle at 12% 88%, rgba(124,195,90,.07) 0 20%, transparent 55%),
    var(--soil);
  color:var(--bone);
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
  padding:28px 18px 40px;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(rgba(244,236,221,.05) 1px, transparent 1px),
    radial-gradient(rgba(244,236,221,.035) 1px, transparent 1px);
  background-size:34px 34px, 71px 71px;
  background-position:0 0, 17px 23px;
}
body>*{position:relative;z-index:1}

/* ── icon 統一規格 ───────────────── */
.ico{
  width:20px;height:20px;flex:none;display:block;
  fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;
}
.ico--sm{width:15px;height:15px}
.ico--lg{width:26px;height:26px}
.ico--fill{fill:currentColor;stroke:none}

/* ── header ──────────────────────── */
header{text-align:center;max-width:680px;margin-bottom:24px;width:100%}

.eyebrow{
  font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.34em;
  text-transform:uppercase;color:var(--leaf);
  display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px;
}
.eyebrow::before,.eyebrow::after{
  content:"";height:1px;width:34px;background:linear-gradient(90deg,transparent,var(--leaf-dark));
}
.eyebrow::after{background:linear-gradient(270deg,transparent,var(--leaf-dark))}

h1{
  font-size:clamp(2rem,6vw,3.1rem);font-weight:800;line-height:1;
  letter-spacing:.04em;color:var(--bone);
  text-shadow:0 3px 0 var(--soil-deep), 0 6px 18px rgba(0,0,0,.5);
  margin-bottom:16px;
}

.global-controls{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap}

.btn{
  font-family:inherit;font-size:.95rem;font-weight:700;
  border:none;border-radius:999px;cursor:pointer;
  padding:11px 20px;
  display:inline-flex;align-items:center;gap:8px;
  color:var(--soil-deep);
  background:var(--btn,var(--stone));
  box-shadow:0 var(--lift) 0 var(--btn-dark,var(--stone-dark));
  transition:transform .12s ease, box-shadow .12s ease, filter .15s ease;
}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){transform:translateY(var(--lift));box-shadow:0 0 0 var(--btn-dark,var(--stone-dark))}
.btn:focus-visible{outline:3px solid var(--bone);outline-offset:3px}
.btn:disabled{--btn:#3c2f22;--btn-dark:#241a12;color:#6d5d4a;cursor:not-allowed}
.btn-start{--btn:var(--leaf);--btn-dark:var(--leaf-dark)}
.btn-stop{--btn:var(--petal);--btn-dark:var(--petal-dark)}
.btn-lap{--btn:var(--accent);--btn-dark:var(--accent-dark)}
.btn-reset{--btn:var(--stone);--btn-dark:var(--stone-dark)}

.peek{
  display:inline-flex;align-items:center;gap:9px;cursor:pointer;
  font-size:.82rem;font-weight:500;color:var(--moss);
  background:var(--soil-deep);border:1px solid var(--root);
  border-radius:999px;padding:8px 15px 8px 11px;user-select:none;
}
.peek input{position:absolute;opacity:0;width:0;height:0}
.peek .track{
  width:36px;height:20px;border-radius:999px;background:var(--root);
  position:relative;transition:background .18s ease;flex:none;
}
.peek .track::after{
  content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;
  background:var(--moss);transition:transform .18s ease, background .18s ease;
}
.peek input:checked + .track{background:var(--leaf-dark)}
.peek input:checked + .track::after{transform:translateX(16px);background:var(--bone)}
.peek input:focus-visible + .track{outline:3px solid var(--bone);outline-offset:3px}

/* ── 版面 ────────────────────────── */
.split-container{display:flex;width:100%;max-width:1080px;gap:22px;flex:1;align-items:stretch}
@media (max-width:860px){.split-container{flex-direction:column}}

.player-panel{
  --accent:var(--stone);--accent-dark:var(--stone-dark);--accent-soft:rgba(138,121,99,.13);
  flex:1;min-width:0;
  background:
    radial-gradient(130% 60% at 50% 0%, rgba(255,255,255,.045), transparent 70%),
    var(--loam);
  border:2px solid var(--root);
  border-radius:30px 30px 26px 26px/34px 34px 26px 26px;
  padding:24px 22px 22px;
  display:flex;flex-direction:column;align-items:center;
  box-shadow:0 6px 0 #17100b, 0 20px 40px rgba(0,0,0,.42);
}
#player1-panel{--accent:var(--p1);--accent-dark:var(--p1-dark);--accent-soft:rgba(240,180,41,.13)}
#player2-panel{--accent:var(--p2);--accent-dark:var(--p2-dark);--accent-soft:rgba(79,158,224,.13)}

.player-title{
  width:100%;display:flex;align-items:center;gap:11px;
  font-size:1.35rem;font-weight:800;color:var(--accent);
}
.player-title .sprout{width:30px;height:38px;flex:none}
.sprout .pod{fill:var(--accent)}
.sprout .leaf{fill:var(--leaf);transform-origin:15px 30px;animation:sway 4.2s ease-in-out infinite}
.sprout .leaf.b{animation-delay:-2.1s}
.sprout .stem{stroke:var(--leaf-dark);stroke-width:2.4;stroke-linecap:round;fill:none}
@keyframes sway{0%,100%{transform:rotate(-3.5deg)}50%{transform:rotate(3.5deg)}}

.winner-badge{
  margin-left:auto;
  display:none;align-items:center;gap:5px;
  background:var(--accent);color:var(--soil-deep);
  font-size:.72rem;font-weight:800;letter-spacing:.16em;
  padding:5px 12px;border-radius:999px;
  box-shadow:0 3px 0 var(--accent-dark);
  animation:bloom 1.6s ease-in-out infinite;
}
.winner-badge.show{display:inline-flex}
@keyframes bloom{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

.key-hints{
  margin:14px 0 6px;display:flex;flex-wrap:wrap;gap:8px 14px;justify-content:center;
  font-size:.78rem;color:var(--moss);font-weight:500;
}
.key-hints span{display:inline-flex;align-items:center;gap:6px}
.kbd{
  font-family:'DM Mono',monospace;font-weight:500;font-size:.75rem;font-style:normal;
  background:var(--soil-deep);color:var(--bone);
  border:1px solid var(--root);border-radius:7px;
  padding:2px 8px;box-shadow:0 2px 0 #100b07;
}

/* ── 訊號盤 ──────────────────────── */
.dial{
  position:relative;width:214px;height:214px;margin:16px 0 20px;
  display:grid;place-items:center;
}
.dial > svg{position:absolute;inset:0;width:100%;height:100%}
.ring-outer{animation:spin 26s linear infinite}
.ring-mid{animation:spin 15s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.dial .rg{transform-origin:100px 100px}
.dial .r1{fill:none;stroke:var(--accent);stroke-opacity:.28;stroke-width:2;stroke-dasharray:3 10;stroke-linecap:round}
.dial .r2{fill:none;stroke:var(--accent);stroke-opacity:.55;stroke-width:3;stroke-dasharray:30 16;stroke-linecap:round}
.dial .core{fill:var(--soil-deep);stroke:var(--accent);stroke-opacity:.4;stroke-width:2}
.dial .glow{fill:var(--accent);opacity:.07;transition:fill .35s ease, opacity .35s ease}
.dial.settled .glow{fill:var(--state);opacity:.13}
.dial .tick{stroke:var(--accent);stroke-opacity:.5;stroke-width:3;stroke-linecap:round}

/* 數字與盲測標籤共用同一格，交叉淡出 */
.display,.blind-tag{grid-area:1/1;z-index:2}

.display{
  display:flex;flex-direction:column;align-items:center;gap:7px;
  transition:opacity .3s ease;
}
.display .num{
  font-size:2.4rem;font-weight:800;color:var(--accent);
  font-variant-numeric:tabular-nums;letter-spacing:.01em;line-height:1;
  text-shadow:0 3px 0 rgba(0,0,0,.45);
}
.display .unit{font-size:.95rem;font-weight:500;color:var(--moss);margin-left:5px}
.display.is-result{gap:0}
.display.is-result .num{font-size:2.05rem}
.display .split{width:52px;height:1px;background:var(--root);margin:9px 0 8px}
.display .dev{
  font-family:'DM Mono',monospace;font-weight:500;font-size:1.3rem;line-height:1;
  font-variant-numeric:tabular-nums;color:var(--moss);
}
.display .dev small{font-size:.62rem;color:var(--moss);margin-left:4px;font-family:inherit}
.display .dev.over{color:var(--over)}
.display .dev.exact{color:var(--exact)}
.display .dev.under{color:var(--under)}
.blindfold{opacity:0 !important;user-select:none}

.blind-tag{
  display:flex;flex-direction:column;align-items:center;gap:8px;
  color:var(--moss);opacity:0;transition:opacity .3s ease;pointer-events:none;
}
.blind-tag em{font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.24em;font-style:normal;text-indent:.24em}
.dial:has(.blindfold) .blind-tag{opacity:1}
.dial:has(.blindfold) .r2{stroke-opacity:.9}
.dial:has(.blindfold) .glow{opacity:.16}

.btn-group{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:18px}

/* ── 紀錄表 ──────────────────────── */
.lap-cols{
  width:100%;display:grid;
  grid-template-columns:1fr var(--col-time) var(--col-diff);
  gap:10px;padding:0 22px 8px;
  font-family:'DM Mono',monospace;font-size:.64rem;letter-spacing:.16em;
  color:var(--moss);text-transform:uppercase;
}
.lap-cols span:nth-child(2),.lap-cols span:nth-child(3){text-align:right}

.lap-container{
  width:100%;flex:1;min-height:180px;max-height:250px;overflow-y:auto;
  background:var(--soil-deep);
  border:2px solid var(--root);border-radius:18px;padding:8px;
  scrollbar-width:thin;scrollbar-color:var(--root) transparent;
}
.lap-container:empty::after{
  content:"還沒有人喊停";
  display:grid;place-items:center;height:160px;
  color:#6d5d4a;font-size:.85rem;font-weight:500;
}
.lap-item{
  display:grid;
  grid-template-columns:1fr var(--col-time) var(--col-diff);
  gap:10px;align-items:center;
  padding:9px 12px;border-radius:12px;font-size:.9rem;font-weight:500;
}
.lap-item+.lap-item{margin-top:2px}
.lap-item .name{display:flex;align-items:center;gap:9px;color:var(--bone);min-width:0}
.lap-item .name .ico{color:var(--stone)}
.lap-item .raw{font-family:'DM Mono',monospace;color:var(--bone);text-align:right}
.lap-item .diff{font-family:'DM Mono',monospace;color:var(--moss);text-align:right;font-weight:500}
.lap-item .diff.tight{color:var(--leaf)}
.lap-item .locked{
  grid-column:2 / -1;
  display:flex;align-items:center;justify-content:flex-end;gap:6px;
  color:#6d5d4a;font-family:'DM Mono',monospace;font-size:.76rem;
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition-duration:.01ms !important}
}
</style>
</head>
<body>

<header>
  <div class="eyebrow">blind timing · 兩組對抗</div>
  <h1>十秒喊停</h1>
  <div class="global-controls">
    <button id="resetAllBtn" class="btn btn-reset">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20.5 3.6v4.3h-4.3"/></svg>
      全部重置
    </button>
    <label class="peek">
      <input type="checkbox" id="peekToggle">
      <span class="track"></span>
      開頭 2 秒顯示時間
    </label>
  </div>
</header>

<div class="split-container">

  <div class="player-panel" id="player1-panel">
    <div class="player-title">
      <svg class="sprout" viewBox="0 0 30 38" aria-hidden="true">
        <path class="stem" d="M15 34V16"/>
        <path class="leaf a" d="M15 20C15 12 9.5 7 3 6.5c0 8 5.5 13.5 12 13.5Z"/>
        <path class="leaf b" d="M15 20c0-8 5.5-13 12-13.5 0 8-5.5 13.5-12 13.5Z"/>
        <ellipse class="pod" cx="15" cy="33" rx="8" ry="4.6"/>
      </svg>
      第一組
      <span id="p1-winner" class="winner-badge">
        <svg class="ico ico--sm ico--fill" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6" r="3.4"/><circle cx="12" cy="18" r="3.4"/><circle cx="6" cy="12" r="3.4"/><circle cx="18" cy="12" r="3.4"/><circle cx="12" cy="12" r="2.6"/></svg>
        WINNER
      </span>
    </div>

    <div class="key-hints">
      <span><i class="kbd">A</i> 開始 / 結算</span>
      <span><i class="kbd">S</i> 喊停</span>
      <span><i class="kbd">D</i> 重設</span>
    </div>

    <div class="dial">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <g class="rg ring-outer"><circle class="r1" cx="100" cy="100" r="95"/></g>
        <g class="rg ring-mid"><circle class="r2" cx="100" cy="100" r="83"/></g>
        <circle class="glow" cx="100" cy="100" r="72"/>
        <circle class="core" cx="100" cy="100" r="70"/>
        <path class="tick" d="M100 24v10"/>
      </svg>
      <div class="display" id="p1-display"></div>
      <div class="blind-tag">
        <svg class="ico ico--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z"/><path d="M4 4 20 20"/></svg>
        <em>盲測中</em>
      </div>
    </div>

    <div class="btn-group">
      <button id="p1-startStopBtn" class="btn btn-start"></button>
      <button id="p1-lapBtn" class="btn btn-lap" disabled></button>
      <button id="p1-resetBtn" class="btn btn-reset"></button>
    </div>


    <div class="lap-cols"><span>成員</span><span>實際秒數</span><span>秒差</span></div>
    <div class="lap-container" id="p1-lapList"></div>
  </div>

  <div class="player-panel" id="player2-panel">
    <div class="player-title">
      <svg class="sprout" viewBox="0 0 30 38" aria-hidden="true">
        <path class="stem" d="M15 34V16"/>
        <path class="leaf a" d="M15 20C15 12 9.5 7 3 6.5c0 8 5.5 13.5 12 13.5Z"/>
        <path class="leaf b" d="M15 20c0-8 5.5-13 12-13.5 0 8-5.5 13.5-12 13.5Z"/>
        <ellipse class="pod" cx="15" cy="33" rx="8" ry="4.6"/>
      </svg>
      第二組
      <span id="p2-winner" class="winner-badge">
        <svg class="ico ico--sm ico--fill" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6" r="3.4"/><circle cx="12" cy="18" r="3.4"/><circle cx="6" cy="12" r="3.4"/><circle cx="18" cy="12" r="3.4"/><circle cx="12" cy="12" r="2.6"/></svg>
        WINNER
      </span>
    </div>

    <div class="key-hints">
      <span><i class="kbd">J</i> 開始 / 結算</span>
      <span><i class="kbd">K</i> 喊停</span>
      <span><i class="kbd">L</i> 重設</span>
    </div>

    <div class="dial">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <g class="rg ring-outer"><circle class="r1" cx="100" cy="100" r="95"/></g>
        <g class="rg ring-mid"><circle class="r2" cx="100" cy="100" r="83"/></g>
        <circle class="glow" cx="100" cy="100" r="72"/>
        <circle class="core" cx="100" cy="100" r="70"/>
        <path class="tick" d="M100 24v10"/>
      </svg>
      <div class="display" id="p2-display"></div>
      <div class="blind-tag">
        <svg class="ico ico--lg" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12s3.5-6 9-6 9 6 9 6-3.5 6-9 6-9-6-9-6Z"/><path d="M4 4 20 20"/></svg>
        <em>盲測中</em>
      </div>
    </div>

    <div class="btn-group">
      <button id="p2-startStopBtn" class="btn btn-start"></button>
      <button id="p2-lapBtn" class="btn btn-lap" disabled></button>
      <button id="p2-resetBtn" class="btn btn-reset"></button>
    </div>


    <div class="lap-cols"><span>成員</span><span>實際秒數</span><span>秒差</span></div>
    <div class="lap-container" id="p2-lapList"></div>
  </div>

</div>

<script>
/* ── SVG icon set：24x24 / stroke 2 / round / currentColor ── */
const ICO = {
  play:  '<svg class="ico ico--fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.4 5.2 18.6 11.1a1 1 0 0 1 0 1.8L8.4 18.8A1 1 0 0 1 7 17.9V6.1a1 1 0 0 1 1.4-.9Z"/></svg>',
  stop:  '<svg class="ico ico--fill" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="3"/></svg>',
  done:  '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12.5 10 18 19.5 6.5"/></svg>',
  call:  '<svg class="ico ico--fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.4c3.3 4.4 5.4 7 5.4 9.6a5.4 5.4 0 0 1-10.8 0C6.6 10.4 8.7 7.8 12 3.4Z"/></svg>',
  reset: '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.5-5.8"/><path d="M20.5 3.6v4.3h-4.3"/></svg>',
  seed:  '<svg class="ico ico--sm ico--fill" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="6" ry="8"/></svg>',
  leaf:  '<svg class="ico ico--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20C4 11.7 10.7 5 19 5c0 8.3-6.7 15-15 15Z"/><path d="M4.5 19.5 14 10"/></svg>',
  lock:  '<svg class="ico ico--sm" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10.5" width="15" height="9.5" rx="3"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>',
  flower:'<svg class="ico ico--fill" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6" r="3.4"/><circle cx="12" cy="18" r="3.4"/><circle cx="6" cy="12" r="3.4"/><circle cx="18" cy="12" r="3.4"/><circle cx="12" cy="12" r="2.6"/></svg>'
};

const TARGET_MS   = 10000;  // 每人目標 10 秒
const MAX_CALLS   = 7;      // 每組人數上限（7 人 → 基準 70 秒）
const PEEK_MS     = 2000;
const TIGHT_MS    = 500;    // 個人秒差在此以內算準
const EXACT_MS    = 500;    // 全組秒差在此以內算「剛好」
let   peekEnabled = false;

const s2 = ms => (ms / 1000).toFixed(2);
const signed = ms => (ms >= 0 ? "+" : "−") + s2(Math.abs(ms));

class TeamGame {
  constructor(id, startStopBtnId, lapBtnId, resetBtnId, displayId, lapListId, winnerBadgeId) {
    this.id = id;
    this.startStopBtn = document.getElementById(startStopBtnId);
    this.lapBtn = document.getElementById(lapBtnId);
    this.resetBtn = document.getElementById(resetBtnId);
    this.display = document.getElementById(displayId);
    this.lapList = document.getElementById(lapListId);
    this.winnerBadge = document.getElementById(winnerBadgeId);
    this.dial = this.display.closest('.dial');

    this.startTime = 0;
    this.elapsedTime = 0;
    this.timerInterval = null;
    this.running = false;
    this.finished = false;
    this.calls = [];
    this.sumMs = 0;      // 全組實際秒數總和
    this.baseMs = 0;     // 基準 = 人數 × 10 秒
    this.deviationMs = 0; // 總和 − 基準

    this.resetBtn.innerHTML = ICO.reset + "重設";
    this.setStartStop("start");
    this.updateCallBtn();
    this.renderTime(0);
    this.initEvents();
  }

  setStartStop(mode) {
    const map = {
      start: ["btn btn-start", ICO.play + "開始"],
      stop:  ["btn btn-stop",  ICO.stop + "結算"],
      done:  ["btn btn-start", ICO.done + "已結算"]
    };
    const [cls, html] = map[mode];
    this.startStopBtn.className = cls;
    this.startStopBtn.innerHTML = html;
  }

  updateCallBtn() {
    this.lapBtn.innerHTML = ICO.call + `喊停 ${this.calls.length}/${MAX_CALLS}`;
    this.lapBtn.disabled = !this.running || this.calls.length >= MAX_CALLS;
  }

  initEvents() {
    this.startStopBtn.addEventListener("click", () => this.toggleStartStop());
    this.lapBtn.addEventListener("click", () => this.recordCall());
    this.resetBtn.addEventListener("click", () => this.reset());
  }

  toggleStartStop() {
    if (!this.running) this.start(); else this.settle();
  }

  start() {
    if (this.finished) return;
    this.startTime = Date.now() - this.elapsedTime;
    this.timerInterval = setInterval(() => this.updateTime(), 10);
    this.running = true;
    this.setStartStop("stop");
    this.updateCallBtn();
    this.updateTime();
  }

  settle() {
    clearInterval(this.timerInterval);
    this.running = false;
    this.finished = true;

    this.sumMs = this.calls.reduce((s, c) => s + c.timeMs, 0);
    this.baseMs = this.calls.length * TARGET_MS;
    this.deviationMs = this.sumMs - this.baseMs;

    this.setStartStop("done");
    this.startStopBtn.disabled = true;
    this.lapBtn.disabled = true;
    this.display.classList.remove("blindfold");
    this.renderResult();
    this.renderList(true);
    checkWinner();
  }

  recordCall() {
    if (!this.running || this.calls.length >= MAX_CALLS) return;
    const t = this.elapsedTime;
    this.calls.push({ seat: this.calls.length + 1, timeMs: t, diffMs: t - TARGET_MS });
    this.updateCallBtn();
    this.renderList(false);
    if (this.calls.length >= MAX_CALLS) this.settle();
  }

  reset() {
    clearInterval(this.timerInterval);
    this.running = false;
    this.finished = false;
    this.elapsedTime = 0;
    this.calls = [];
    this.sumMs = this.baseMs = this.deviationMs = 0;
    this.renderTime(0);
    this.display.classList.remove("blindfold");
    this.setStartStop("start");
    this.startStopBtn.disabled = false;
    this.updateCallBtn();
    this.lapList.innerHTML = "";
    this.dial.classList.remove("settled");
    this.dial.style.removeProperty("--state");
    this.winnerBadge.classList.remove("show");
  }

  renderTime(ms) {
    this.display.classList.remove("is-result");
    this.display.innerHTML = `<span class="num">${s2(ms)}<span class="unit">秒</span></span>`;
  }

  /* 結算：圓內只放兩個數字 —— 總時間 / 總秒差 */
  renderResult() {
    const dev = this.deviationMs;
    const state = dev > EXACT_MS ? "over" : (dev < -EXACT_MS ? "under" : "exact");
    this.dial.style.setProperty("--state", `var(--${state})`);
    this.dial.classList.add("settled");
    this.display.classList.add("is-result");
    this.display.innerHTML =
      `<span class="num">${s2(this.sumMs)}<span class="unit">秒</span></span>` +
      `<span class="split"></span>` +
      `<span class="dev ${state}">${signed(dev)}<small>秒</small></span>`;
  }

  updateTime() {
    this.elapsedTime = Date.now() - this.startTime;
    this.renderTime(this.elapsedTime);
    this.display.classList.toggle("blindfold", !peekEnabled || this.elapsedTime >= PEEK_MS);
  }

  renderList(revealed) {
    this.lapList.innerHTML = "";
    for (let i = this.calls.length - 1; i >= 0; i--) {
      const c = this.calls[i];
      const item = document.createElement("div");
      item.className = "lap-item";
      const mark = revealed ? ICO.leaf : ICO.seed;
      let cells;
      if (revealed) {
        const tight = Math.abs(c.diffMs) <= TIGHT_MS ? " tight" : "";
        cells = `<span class="raw">${s2(c.timeMs)}</span>`
              + `<span class="diff${tight}">${signed(c.diffMs)}</span>`;
      } else {
        cells = `<span class="locked">${ICO.lock}封存中</span>`;
      }
      item.innerHTML = `<span class="name">${mark}第 ${c.seat} 位</span>${cells}`;
      this.lapList.appendChild(item);
    }
  }

}

const p1 = new TeamGame('p1','p1-startStopBtn','p1-lapBtn','p1-resetBtn','p1-display','p1-lapList','p1-winner');
const p2 = new TeamGame('p2','p2-startStopBtn','p2-lapBtn','p2-resetBtn','p2-display','p2-lapList','p2-winner');

document.getElementById('resetAllBtn').addEventListener('click', () => { p1.reset(); p2.reset(); });

document.getElementById('peekToggle').addEventListener('change', (e) => {
  peekEnabled = e.target.checked;
  [p1, p2].forEach(t => { if (t.running) t.updateTime(); });
});

/* 勝負：與基準的偏離量較小者勝 */
function checkWinner() {
  if (!(p1.finished && p2.finished)) return;
  const a = Math.abs(p1.deviationMs), b = Math.abs(p2.deviationMs);
  p1.winnerBadge.classList.toggle("show", a <= b);
  p2.winnerBadge.classList.toggle("show", b <= a);
}

window.addEventListener('keydown', (e) => {
  const tag = e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  const key = e.key.toLowerCase();
  if (key === 'a') p1.toggleStartStop();
  else if (key === 's') p1.recordCall();
  else if (key === 'd') p1.reset();
  if (key === 'j') p2.toggleStartStop();
  else if (key === 'k') p2.recordCall();
  else if (key === 'l') p2.reset();
});
</script>
</body>
