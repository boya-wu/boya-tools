<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Define the gradient combining Cobalt Blue and Rose Red from style.css -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <!-- Drop shadow for the inner icon to make it premium -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#brand-grad)" />

  <!-- Unified Lucide briefcase Icon (Scaled to 512x512) -->
  <!-- Original Lucide viewBox is 24x24, scaled by 13.333 (size 320x320), centered at (96, 96) -->
  <g filter="url(#shadow)" transform="translate(96, 96) scale(13.333)">
    <path d="M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <rect width="20" height="14" x="2" y="6" rx="2" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
